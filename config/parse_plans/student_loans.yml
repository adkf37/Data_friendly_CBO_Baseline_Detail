- workbook: 51310-2020-03-studentloan.xlsx
  sheets:
  - sheet: Memo
    classification: notes
    include: false
    output_dataset: null
    verification_target: null
    header_rows: 1-1
    first_data_row: null
    year_column_strategy: none
    year_columns: []
    unit: FCRA requires that the lifetime costs of student loans be recorded up front on an accrual basis (that is, they are
      recognized in the year in which the loan is made). The lifetime cost of a federal loan—called its subsidy cost—is measured
      by discounting all of the expected future cash flows associated with the loan to a present value at the date the loan
      is disbursed. Present value is a single number that expresses a flow of current and future income, or payments, in terms
      of an equivalent lump sum received, or paid, at a specific time. The present value depends on the rate of interest—the
      discount rate—that is used to translate future cash flows into current dollars. The cash flows include the amounts disbursed,
      principal repaid, interest received, fees charged, and net losses that accrue from defaults.
